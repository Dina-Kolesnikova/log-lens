<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>⌕ Log Lens — paste viewer</title>
<link rel="stylesheet" href="jsontree.css">
<style>
  body { font: 13px/1.5 -apple-system, "Segoe UI", sans-serif; margin: 0; background: #f1e8d5; color: #3a2f21; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: #eee3cb; border-bottom: 1px solid #e4d7ba; }
  header b { font-family: "Iowan Old Style", Georgia, serif; font-size: 16px; color: #3a2f21; }
  #input-wrap { padding: 16px; }
  textarea { width: 100%; height: 60vh; box-sizing: border-box; font: 12px/1.5 ui-monospace, Menlo, monospace; padding: 12px; border: 1px solid #d8c9ab; border-radius: 12px; background: #fdfaf2; resize: vertical; }
  .hint { color: #8a7a5e; font-size: 12px; margin: 8px 0; }
  button.big { padding: 8px 18px; font: inherit; border: 1px solid #c96f2e; border-radius: 999px; background: #c96f2e; color: #fdf6e9; cursor: pointer; }
  button.plain { padding: 6px 14px; font: inherit; border: 1px solid #d8c9ab; border-radius: 999px; background: #fdfaf2; cursor: pointer; }
  #out { padding: 12px 16px; }
</style>
</head>
<body>
  <header><b>⌕ Log Lens</b> paste viewer <button id="again" class="plain" hidden>↩ new paste</button></header>
  <div id="input-wrap">
    <p class="hint">Paste any log text — pure JSON or a mix of preamble + JSON blobs (log-raw dumps work). Nothing leaves your browser.</p>
    <textarea id="in" placeholder='{"paste": "your JSON here"}' autofocus></textarea>
    <p><button id="render" class="big">Render tree (⌘⏎)</button></p>
  </div>
  <div id="out" hidden></div>
  <script src="jsontree.js"></script>
  <script src="standalone.js"></script>
</body>
</html>
