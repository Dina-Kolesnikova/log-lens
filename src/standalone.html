<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>⌕ Log Lens — paste viewer</title>
<link rel="stylesheet" href="jsontree.css">
<style>
  body { font: 13px/1.5 -apple-system, "Segoe UI", sans-serif; margin: 0; background: #f5f7fa; color: #1f2430; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: #fff; border-bottom: 1px solid #d7dce3; }
  header b { color: #4653c6; }
  #input-wrap { padding: 16px; }
  textarea { width: 100%; height: 60vh; box-sizing: border-box; font: 12px/1.5 ui-monospace, Menlo, monospace; padding: 10px; border: 1px solid #c3cad4; border-radius: 8px; resize: vertical; }
  .hint { color: #5a6472; font-size: 12px; margin: 8px 0; }
  button.big { padding: 8px 16px; font: inherit; border: 1px solid #4653c6; border-radius: 6px; background: #4653c6; color: #fff; cursor: pointer; }
  button.plain { padding: 6px 12px; font: inherit; border: 1px solid #c3cad4; border-radius: 6px; background: #fff; cursor: pointer; }
  #out { padding: 12px 16px; }
</style>
</head>
<body>
  <header><b>⌕ Log Lens</b> paste viewer <button id="again" class="plain" hidden>↩ new paste</button></header>
  <div id="input-wrap">
    <p class="hint">Paste any log text — pure JSON or a mix of preamble + JSON blobs (log-raw dumps work). Nothing leaves your browser.</p>
    <textarea id="in" placeholder='{"paste": "your JSON here"}' autofocus></textarea>
    <p><button id="render" class="big">Render tree (⌘⏎)</button></p>
  </div>
  <div id="out" hidden></div>
  <script src="jsontree.js"></script>
  <script src="standalone.js"></script>
</body>
</html>
