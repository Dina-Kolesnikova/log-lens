<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px/1.5 -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 12px; width: 240px; background: #faf4e6; color: #3a2f21; }
  h1 { font-family: "Iowan Old Style", Georgia, serif; font-size: 16px; font-weight: 800; margin: 0 0 10px; color: #3a2f21; }
  button { display: block; width: 100%; margin: 6px 0; padding: 8px 14px; font: inherit; border: 1px solid #d8c9ab; border-radius: 999px; background: #fdfaf2; color: #3a2f21; cursor: pointer; text-align: left; }
  button:hover { background: #f3e9d2; }
  p { color: #8a7a5e; font-size: 11px; margin: 10px 0 0; }
</style>
</head>
<body>
  <h1>⌕ Log Lens</h1>
  <label id="siterow" style="display:flex;align-items:center;gap:8px;margin:0 0 10px;padding:8px 14px;border:1px solid #d8c9ab;border-radius:999px;background:#fdfaf2;cursor:pointer;">
    <input type="checkbox" id="sitetoggle" style="margin:0;">
    <span>Tree view in this tab</span>
  </label>
  <button id="enhance">Enhance this page</button>
  <button id="paste">Open paste viewer</button>
  <button id="options">Auto-run sites…</button>
  <p>Sites added under "Auto-run sites" are enhanced automatically. Use "Enhance this page" anywhere else.</p>
  <script src="popup.js"></script>
</body>
</html>
