<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px/1.5 -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 12px; width: 240px; background: #fff; color: #1f2430; }
  h1 { font-size: 13px; margin: 0 0 10px; color: #4653c6; }
  button { display: block; width: 100%; margin: 6px 0; padding: 8px 10px; font: inherit; border: 1px solid #c3cad4; border-radius: 6px; background: #f7f9fb; cursor: pointer; text-align: left; }
  button:hover { background: #e8ecf2; }
  p { color: #5a6472; font-size: 11px; margin: 10px 0 0; }
</style>
</head>
<body>
  <h1>⌕ Log Lens</h1>
  <label id="siterow" style="display:flex;align-items:center;gap:8px;margin:0 0 10px;padding:8px 10px;border:1px solid #e3e7ee;border-radius:6px;cursor:pointer;">
    <input type="checkbox" id="sitetoggle" style="margin:0;">
    <span>Tree view on this site</span>
  </label>
  <button id="enhance">Enhance this page</button>
  <button id="paste">Open paste viewer</button>
  <button id="options">Auto-run sites…</button>
  <p>Sites added under "Auto-run sites" are enhanced automatically. Use "Enhance this page" anywhere else.</p>
  <script src="popup.js"></script>
</body>
</html>
